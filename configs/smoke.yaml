# Smoke / short run (not full paper protocol)
paper:
  slug: detecting-multi-scale-faces-using-attention-based-feature-fusion-and-s
  title: SANet (smoke)
source_code:
  url: null
data:
  root: ../../datasets/wider-face
  max_train_samples: 64
  max_val_samples: 32
model:
  name: sanet
  attention_mode: sa
  input_size: 640
  pretrained_backbone: true
train:
  batch_size: 2
  max_iters: 20
  lr: 0.001
  lr_gamma: 0.1
  lr_milestones: [80000, 100000]
  momentum: 0.9
  weight_decay: 0.0005
  iou_thresh: 0.35
  num_workers: 2
  log_every: 5
  ckpt_every: 20
  seed: 42
eval:
  batch_size: 2
  score_thresh: 0.05
  nms_thresh: 0.5
paths:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  pred_dir: outputs/predictions
  figure_dir: outputs/figures
report:
  title: SANet Smoke Report
device: cuda
